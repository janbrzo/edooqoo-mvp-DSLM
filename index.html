    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "mainEntity": [
        {"@type":"Question","name":"Do I need to be logged in to generate worksheets?","acceptedAnswer":{"@type":"Answer","text":"No, you can try the worksheet generator without logging in (demo mode). However, to save worksheets and access all features, you need to create an account. When you sign up, you get 2 free tokens to start creating worksheets immediately."}},
        {"@type":"Question","name":"What happens when I run out of tokens?","acceptedAnswer":{"@type":"Answer","text":"When you have no tokens or monthly worksheets left, you can either upgrade to a subscription plan for monthly worksheets or purchase additional tokens. The system first uses your monthly allowance, then uses available tokens."}},
        {"@type":"Question","name":"How does the upgrade/downgrade system work?","acceptedAnswer":{"@type":"Answer","text":"You can upgrade anytime and pay only the prorated difference. For downgrades, the change takes effect at your next billing cycle. All unused monthly worksheets automatically roll over as tokens so you never lose them."}},
        {"@type":"Question","name":"What are rollover tokens and how do they work?","acceptedAnswer":{"@type":"Answer","text":"Unused monthly worksheets automatically convert to rollover tokens at the end of your billing cycle. These tokens are used after your purchased tokens but before new monthly worksheets. This ensures you never lose unused worksheets!"}},
        {"@type":"Question","name":"What is Share Interactive Worksheet?","acceptedAnswer":{"@type":"Answer","text":"You can share any worksheet with students via a secure permanent link (auto-generated at creation). Students can open it in their browser, fill in answers interactively, and you can see their responses in real-time or review them later. Students can also access all their shared worksheets through the Student Hub portal."}},
        {"@type":"Question","name":"What is Live Session mode?","acceptedAnswer":{"@type":"Answer","text":"Live Session mode allows you to conduct real-time lessons. You can see all students' answers as they type, add exercises on-the-fly (up to 12 per session), and view nano-skill mastery ratings per exercise. AI evaluation assists with scoring open-ended exercises like paraphrasing and discussion questions, making it perfect for online group classes or tutoring sessions."}},
        {"@type":"Question","name":"How do Flashcards work?","acceptedAnswer":{"@type":"Answer","text":"Add vocabulary to flashcards by clicking the + button on individual words in the Vocabulary Sheet, using 'Add All to Flashcards' button, or by selecting words directly on the worksheet. Students study using the spaced repetition system (SM-2 algorithm) for effective learning. Students can also browse and study their flashcards independently through the Student Hub portal."}},
        {"@type":"Question","name":"What is Student Knowledge tracking?","acceptedAnswer":{"@type":"Answer","text":"Student Knowledge lets you record important notes about each student - their strengths, weaknesses, interests, and preferences. This information is automatically fed to the AI when generating worksheets, creating more personalized and relevant content for each student."}},
        {"@type":"Question","name":"How does Homework Assignments work?","acceptedAnswer":{"@type":"Answer","text":"You can assign any worksheet or specific exercises as homework. Set deadlines, send email notifications to students, track completion status, and add teacher comments. Students can complete homework interactively online — either through the direct link or via the Student Hub portal. AI automatically evaluates open-ended answers and pre-fills mastery scores for teacher review."}},
        {"@type":"Question","name":"Can I draw on worksheets?","acceptedAnswer":{"@type":"Answer","text":"Yes! The Draw on Worksheet feature lets you annotate worksheets during lessons - highlight text, circle answers, draw diagrams. Your drawings are saved and can be exported with the worksheet."}},
        {"@type":"Question","name":"What file formats can I download?","acceptedAnswer":{"@type":"Answer","text":"You can download worksheets as HTML files (recommended for best quality) or PDF files. HTML files work offline and preserve all formatting perfectly. All registered users have automatic download access."}},
        {"@type":"Question","name":"How does student management work?","acceptedAnswer":{"@type":"Answer","text":"You can add unlimited students to your account. Each worksheet gets assigned to a specific student, and you can view all worksheets created for each student. You can send each student a Welcome Test to assess their level, and the AI creates a detailed Learning Profile with strengths, weaknesses, and a recommended Learning Path."}},
        {"@type":"Question","name":"What exercise types are available?","acceptedAnswer":{"@type":"Answer","text":"Edooqoo offers 29 exercise types organized in 3 categories: Basic Exercises (20 types) including Reading Comprehension, Fill in the Blanks, Multiple Choice, True/False Questions, Matching Exercise, Dialogue Practice, Answer Questions, Discussion Questions, Error Correction, Odd One Out, Matching Halves, Word Order, Gap Text (Cloze), Negative Prefixes, Categorization, Complete Word, Paraphrasing, Sentence Transformation, Synonyms Matching, and Antonyms Matching. Audio Exercises (5 types): Listening Comprehension, Fill in the Blanks (Audio), Multiple Choice (Audio), True/False (Audio), and Answer Questions (Audio). Picture Exercises (4 types): Describe Picture, Multiple Choice (Picture), True/False (Picture), and Answer Questions (Picture)."}},
        {"@type":"Question","name":"How long does worksheet generation take?","acceptedAnswer":{"@type":"Answer","text":"Worksheet generation typically takes 30-60 seconds. The AI creates custom content based on your specifications like English level, lesson topic, learning goals, and student context."}},
        {"@type":"Question","name":"Can I cancel my subscription anytime?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can cancel anytime through the 'Manage Subscription' button in your profile, which opens the Stripe Customer Portal. Your subscription remains active until the end of your current billing period."}},
        {"@type":"Question","name":"What happens if worksheet generation fails?","acceptedAnswer":{"@type":"Answer","text":"If generation fails, you'll see an error message and return to the form with all your input preserved. No tokens are consumed for failed generations, so you can try again without penalty."}},
        {"@type":"Question","name":"Do you offer refunds or free trials?","acceptedAnswer":{"@type":"Answer","text":"We offer 2 free tokens when you sign up to test the service. For subscription refunds, please contact support. You can also start with our Free Demo plan to evaluate the service."}},
        {"@type":"Question","name":"Is there a limit on students I can manage?","acceptedAnswer":{"@type":"Answer","text":"No, there's no limit on the number of students you can add to your account. Student management is available for all registered users at no additional cost."}},
        {"@type":"Question","name":"What's the difference between tokens and monthly worksheets?","acceptedAnswer":{"@type":"Answer","text":"Monthly worksheets are included with subscription plans and reset each billing cycle. Tokens are purchased separately and never expire. The system uses monthly worksheets first, then tokens."}},
        {"@type":"Question","name":"Can I use the service for commercial purposes?","acceptedAnswer":{"@type":"Answer","text":"Yes, all plans support commercial use including private tutoring, language schools, and corporate training. The worksheets you create are yours to use commercially."}},
        {"@type":"Question","name":"Can I duplicate worksheets?","acceptedAnswer":{"@type":"Answer","text":"Yes! You can duplicate any worksheet to create a copy. This is useful when you want to reuse similar content for different students or create variations of the same lesson."}},
        {"@type":"Question","name":"What is the Student Hub?","acceptedAnswer":{"@type":"Answer","text":"The Student Hub is a dedicated portal for your students. Students visit the portal, enter their email, and select their teacher to access a personalized dashboard. From there they can view quick stats, browse shared worksheets, study flashcards with spaced repetition, complete homework assignments, book and manage lessons, and sync with Google Calendar."}},
        {"@type":"Question","name":"What is the Welcome Test & Learning Path?","acceptedAnswer":{"@type":"Answer","text":"The Welcome Test is an AI-powered 49-question assessment covering grammar, vocabulary, reading, listening, and speaking. After the student completes it, AI analyzes the results to create a detailed Learning Profile with skill scores, strengths, and weaknesses. It also determines one of 4 Learning Paths (Comfort, Guided, Accelerated, or Target) based on 15 behavioral and performance signals."}},
        {"@type":"Question","name":"How does Lesson Booking work?","acceptedAnswer":{"@type":"Answer","text":"Teachers get a public booking page link to share with students. Students enter their email, browse available time slots, and book lessons — including weekly recurring bookings. Reschedule and cancellation options are configurable by the teacher. The system integrates with Google Calendar for automatic sync and supports Google Meet link auto-generation."}},
        {"@type":"Question","name":"How does Student Progress tracking work?","acceptedAnswer":{"@type":"Answer","text":"Student skills are tracked at the nano-skill level with CEFR tags across categories: grammar, vocabulary, speaking, listening, reading, and writing. Mastery metrics update automatically from worksheet completions, homework submissions, flashcard reviews, and teacher evaluations. Teachers can view mastery trends and get AI-generated suggestions for future worksheets based on skill gaps."}},
        {"@type":"Question","name":"How does AI Evaluation work?","acceptedAnswer":{"@type":"Answer","text":"AI automatically evaluates open-ended student answers — such as sentence transformation, paraphrasing, discussion questions, and descriptions — and pre-fills mastery scores (0-100) for each item. Teachers can review, adjust, and confirm the AI scores. This works across worksheet review, homework submissions, and live sessions."}}
