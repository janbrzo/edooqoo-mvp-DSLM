name: Supabase Functions Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

permissions:
  contents: read

jobs:
  deploy-functions:
    name: Deploy Supabase edge functions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: "Preflight: verify Supabase access token is visible to this job"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty in this job context."
            echo "Add it as a Repository secret: Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN present (length ${#SUPABASE_ACCESS_TOKEN})"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Deploy each function individually so one failure doesn't block the rest.
          # "mcp" is excluded: it's auto-generated by the @lovable.dev/mcp-js Vite
          # plugin, bundles to ~26 MB, and exceeds Supabase's function size limit.
          failed=0
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in
              _shared|mcp) continue ;;
            esac
            echo "::group::Deploying $fn"
            if ! npx supabase@2 functions deploy "$fn" --project-ref bvfrkzdlklyvnhlpleck; then
              echo "::error::Failed to deploy $fn"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
