name: Cloudflare Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - 'cloudflare/**'
      - 'src/lib/mcp/**'
      - 'scripts/seo/generate-edge-routing.mjs'
      - 'scripts/seo/content-registry.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker edge routing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_WORKER_DEPLOY_ENABLED == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || (echo "lockfile out of sync — falling back to npm install" && npm install --no-audit --no-fund)

      - name: Generate edge routing manifest
        run: npm run seo:generate-edge-routing

      - name: Build static assets
        run: npm run build
        env:
          # vite build wymaga tych env żeby wygenerować SPA — bierzemy je z Secrets
          VITE_SUPABASE_URL: https://bvfrkzdlklyvnhlpleck.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: bvfrkzdlklyvnhlpleck

      - name: Preflight — verify Cloudflare secrets are visible to this job
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty in this job context."
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID present (length ${#CLOUDFLARE_ACCOUNT_ID})"
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty in this job context."
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN present (length ${#CLOUDFLARE_API_TOKEN})"
          fi
          if [ "$missing" = "1" ]; then
            echo "Add both as Repository secrets: Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Deploy Worker and route bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy --config wrangler.toml

      - name: Wait for edge propagation
        run: sleep 30

      - name: Verify live routing (soft)
        run: npm run seo:verify-live-routing -- --soft
