name: SEO Integrity

on:
  pull_request:
  workflow_dispatch:

jobs:
  seo-integrity:
    name: SEO, LLM resources, TypeScript, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || (echo "lockfile out of sync, falling back to npm install" && npm install --no-audit --no-fund)

      # Local and CI generation share the same ordered pipeline, including post-processing.
      - name: Synchronize generated SEO assets
        run: npm run seo:sync-generated

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Repeat synchronization to verify determinism
        run: npm run seo:sync-generated

      - name: Verify repeated generation leaves no changes
        run: git diff --exit-code

      - name: Audit all content contracts
        run: npm run content:audit

      - name: Check cluster backlinks and snapshot repairs
        run: npm run seo:check-cluster-hub-links && npm run seo:check-snapshot-snippets && npm run seo:check-snapshot-head

      - name: Test generated edge routing
        run: npm run seo:test-edge-routing

      - name: Audit SEO and AI resources
        run: npm run seo:audit

      - name: Audit duplicate and weak metadata
        run: npm run seo:audit-duplicate-meta

      - name: Check for conflicting JSON-LD @id nodes
        run: npm run seo:check-jsonld

      - name: Audit structured data and citation coverage
        run: npm run seo:audit-structured-data

      - name: Audit sitemap integrity (no stubs, no noindex, no missing files)
        run: npm run seo:audit-sitemap-integrity

      - name: Audit pSEO index policy across policy, prerender and sitemap
        run: npm run seo:audit-pseo-policy


      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Install isolated PostgreSQL test dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib

      - name: Unit tests
        run: npm test

      - name: Full SEO production build
        run: npm run build:seo

