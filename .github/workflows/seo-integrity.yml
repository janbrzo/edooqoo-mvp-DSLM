name: SEO Integrity

on:
  pull_request:
  workflow_dispatch:

jobs:
  seo-integrity:
    name: SEO, LLM resources, TypeScript, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || (echo "lockfile out of sync — falling back to npm install" && npm install --no-audit --no-fund)

      - name: Generate source-of-truth manifest
        run: npm run docs:audit-source

      - name: Generate citable pages
        run: node scripts/seo/generate-citable-pages.mjs

      - name: Generate strategic articles
        run: npm run seo:generate-strategic-content

      - name: Generate rewritten strategic articles
        run: npm run seo:generate-legacy-strategic-content

      - name: Regenerate x1000 citable pages
        run: node scripts/seo/generate-citable-pages.mjs

      - name: Repair content encoding
        run: npm run content:repair-encoding

      - name: Build blog index and sitemap
        run: node scripts/seo/build-blog-index.mjs

      - name: Generate blog triage
        run: npm run seo:generate-blog-triage

      - name: Generate x1000 SEO planning docs
        run: npm run seo:generate-x1000-docs

      - name: Apply programmatic SEO index policy
        run: npm run seo:apply-pseo-policy

      - name: Generate next-lesson decision routes
        run: npm run seo:generate-decision-content

      - name: Test next-lesson decision routes
        run: npm run seo:test-decision-tool

      - name: Test newsletter lifecycle
        run: npm run seo:test-newsletter

      - name: Generate content registry
        run: npm run content:generate

      - name: Inject cluster hub backlinks
        run: npm run seo:inject-cluster-hub-links

      - name: Audit cluster hubs
        run: npm run seo:audit-cluster-hubs

      - name: Generate Cloudflare content routing
        run: npm run seo:generate-edge-routing

      - name: Sync sitemap Edge Function payload
        run: npm run seo:sync-sitemap-edge

      - name: Generate AI discovery resources
        run: node scripts/seo/generate-ai-resources.mjs

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Audit SEO and AI resources
        run: npm run seo:audit

      - name: Audit duplicate and weak metadata
        run: npm run seo:audit-duplicate-meta

      - name: Check for conflicting JSON-LD @id nodes
        run: npm run seo:check-jsonld

      - name: Audit structured data and citation coverage
        run: npm run seo:audit-structured-data


      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Full SEO production build
        run: npm run build:seo

