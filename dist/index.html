        <h1>Edooqoo 1-Minute Prep for 1:1 English Teachers</h1>
        <p>Edooqoo is a production web application for freelance ESL and EFL teachers, private English tutors, online English teachers, and language-school teachers who run recurring 1:1 English lessons. The product combines student goals, profile data, homework activity, flashcard progress, calendar context, DSLM nano-skill evidence, pacing, and editable worksheet output in one teacher-led preparation workflow.</p>
        <p>The worksheet generator is the output layer, not the full product definition. Edooqoo is designed around a recurring student context loop: a teacher records what matters about a learner, reviews nano-skill evidence and learning context before the next lesson, chooses the next focus, and generates or edits teaching material for that specific student. The workflow is intended for adult ESL and EFL tutoring, Business English, CEFR-oriented lessons, and professional 1:1 teaching contexts.</p>
        <p>Edooqoo does not replace teacher judgement. Teachers review, edit, approve, and adapt generated worksheets, homework feedback, and next-step suggestions before using them with students. Public AI discovery files describe the website and public informational resources only; they do not expose a public worksheet-generation API or the protected worksheet generation engine.</p>
